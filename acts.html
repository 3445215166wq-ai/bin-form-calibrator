<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>bin 哥滑动变阻器 · 一个赛季的四幕</title>
<style>
  :root{
    --ink:#070a11;
    --line:rgba(160,185,235,.16);
    --text:#e9eefb;
    --muted:#7c8aa6;
    --blue:#4d7cff;
    --gold:#ffca4d;
    --red:#ff5c5c;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;min-height:100%;
    display:flex;justify-content:center;
    padding:26px 16px 34px;
    font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,sans-serif;
    color:var(--text);
    background:radial-gradient(120% 70% at 50% -10%, #131c30 0%, #070a11 55%, #05070c 100%);
  }
  .app{width:100%;max-width:520px;display:flex;flex-direction:column;gap:16px}

  /* ---------- header ---------- */
  header{text-align:center}
  .kicker{
    font-size:11px;letter-spacing:.28em;color:var(--muted);
    text-transform:uppercase;
  }
  h1{
    margin:8px 0 0;font-size:clamp(20px,5.6vw,26px);font-weight:800;letter-spacing:.01em;
  }
  h1 em{font-style:normal;color:var(--gold)}

  /* ---------- stage ---------- */
  .stage{
    position:relative;
    aspect-ratio:4/5;
    border-radius:20px;
    overflow:hidden;
    background:#05070c;
    border:1px solid var(--line);
    box-shadow:0 30px 70px -40px #000, inset 0 0 80px rgba(0,0,0,.7);
    isolation:isolate;
    transition:aspect-ratio .35s ease;
  }
  .layer{position:absolute;inset:0;pointer-events:none}
  .l-gold{
    opacity:var(--warm,0);transition:opacity .7s ease;
    background:
      radial-gradient(70% 45% at 50% 8%, rgba(255,202,77,.30) 0%, transparent 70%),
      radial-gradient(60% 40% at 50% 100%, rgba(255,202,77,.16) 0%, transparent 72%);
  }
  .l-alarm{
    opacity:var(--alarm,0);transition:opacity .5s ease;
    background:
      radial-gradient(95% 70% at 50% 30%, rgba(255,40,40,.34) 0%, transparent 74%),
      linear-gradient(180deg, rgba(140,10,22,.55), transparent 68%);
    box-shadow:inset 0 0 80px rgba(255,30,30,.6);
    mix-blend-mode:screen;
  }
  .l-night{
    opacity:var(--night,0);transition:opacity .7s ease;
    background:radial-gradient(70% 50% at 50% 96%, rgba(90,150,255,.35) 0%, transparent 70%);
    mix-blend-mode:screen;
  }
  .l-vig{
    background:radial-gradient(120% 90% at 50% 45%, transparent 45%, rgba(0,0,0,.72) 100%);
  }
  #scene{position:absolute;inset:0;width:100%;height:100%;display:block}

  .shake{animation:shk .42s infinite}
  @keyframes shk{
    0%,100%{transform:translate(0,0)}
    25%{transform:translate(-4px,2px)}
    50%{transform:translate(3px,-3px)}
    75%{transform:translate(-2px,-1px)}
  }

  /* 图模式：用户上传（整张自适应显示） */
  #photo{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:none;background:#05070c}
  .stage.photo #photo{display:block}
  .stage.photo #scene,.stage.photo #art{display:none}

  /* 图片素材模式：assets/ 里有图就用图，没有就回落到 SVG 漫画 */
  #art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none;
       opacity:0;transition:opacity .45s ease}
  .stage.art #art{display:block}
  .stage.art.art-ready #art{opacity:1}
  .stage.art #scene{display:none}
  [data-beat="7"] #art,[data-beat="8"] #art{filter:saturate(.55) brightness(.86)}
  .photo-close{
    position:absolute;top:10px;right:10px;z-index:6;
    width:30px;height:30px;border-radius:50%;
    border:1px solid rgba(255,255,255,.28);
    background:rgba(0,0,0,.55);color:#fff;font-size:14px;line-height:1;
    cursor:pointer;display:none;place-items:center;
  }
  .stage.photo .photo-close{display:grid}

  /* 金色雨 */
  .rain{position:absolute;inset:0;overflow:hidden;pointer-events:none;opacity:0;transition:opacity .6s}
  .rain-on .rain{opacity:1}
  .rain i{
    position:absolute;top:-8%;width:5px;height:9px;border-radius:1px;
    background:linear-gradient(180deg,#fff2c0,var(--gold));
    animation:fall linear infinite;
  }
  @keyframes fall{
    0%{transform:translateY(-10vh) rotate(0deg)}
    100%{transform:translateY(120vh) rotate(320deg)}
  }

  /* 弹幕 */
  .danmu{position:absolute;inset:0;overflow:hidden;pointer-events:none}
  .danmu span{
    position:absolute;left:100%;white-space:nowrap;font-weight:700;
    text-shadow:0 1px 3px rgba(0,0,0,.9),0 0 10px rgba(0,0,0,.6);
    animation:fly linear forwards;
  }
  @keyframes fly{to{transform:translateX(calc(-100% - 100cqw))}}
  .danmu{container-type:inline-size}

  /* HUD */
  .hud{position:absolute;inset:auto 0 0 0;padding:12px 14px 13px;pointer-events:none;
       background:linear-gradient(180deg,transparent,rgba(3,5,10,.9) 45%)}
  .chap{
    font-size:10px;letter-spacing:.18em;color:var(--gold);
    display:flex;align-items:center;gap:6px;margin-bottom:5px;
  }
  .chap::before{content:"";width:12px;height:1px;background:currentColor;opacity:.7}
  .cap{margin:0;font-size:14px;font-weight:700;line-height:1.45;color:#f2f6ff}

  /* ---------- timeline ---------- */
  .timeline{display:flex;flex-direction:column;gap:7px}
  .track{position:relative;height:26px;display:flex;align-items:center}
  .track::before{
    content:"";position:absolute;inset:11px 0;border-radius:99px;
    background:rgba(255,255,255,.07);
    box-shadow:inset 0 1px 2px rgba(0,0,0,.6);
  }
  .fill{
    position:absolute;inset:11px auto 11px 0;border-radius:99px;width:0;
    background:linear-gradient(90deg,var(--blue),var(--gold));
    transition:width .45s cubic-bezier(.3,.9,.4,1);
    box-shadow:0 0 14px rgba(255,202,77,.35);
  }
  input[type=range]{
    -webkit-appearance:none;appearance:none;position:relative;
    width:100%;height:26px;margin:0;background:transparent;cursor:grab;
  }
  input[type=range]:active{cursor:grabbing}
  input[type=range]::-webkit-slider-runnable-track{height:26px;background:transparent}
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:16px;height:16px;border-radius:50%;
    background:#fff;border:none;margin-top:5px;
    box-shadow:0 0 0 3px rgba(7,10,17,.95),0 0 0 4px rgba(255,255,255,.22),0 3px 10px rgba(0,0,0,.7);
  }
  input[type=range]::-moz-range-track{height:26px;background:transparent}
  input[type=range]::-moz-range-thumb{
    width:15px;height:15px;border:none;border-radius:50%;background:#fff;
    box-shadow:0 0 0 3px rgba(7,10,17,.95),0 0 0 4px rgba(255,255,255,.22);
  }
  .chapters{display:grid;grid-template-columns:3fr 3fr 5fr 4fr;gap:0;font-size:11px;color:#5f6c85}
  .chapters span{text-align:center;transition:color .3s}
  .chapters span.on{color:#fff;font-weight:700}

  /* ---------- controls ---------- */
  .controls{display:flex;gap:8px;justify-content:center}
  .btn{
    display:inline-flex;align-items:center;gap:6px;
    height:34px;padding:0 14px;border-radius:99px;
    font:inherit;font-size:12.5px;font-weight:600;color:#c9d5ec;
    background:rgba(255,255,255,.04);
    border:1px solid rgba(160,185,235,.18);
    cursor:pointer;transition:background .18s,border-color .18s,color .18s,transform .12s;
    user-select:none;
  }
  .btn:hover{background:rgba(255,255,255,.09);color:#fff;border-color:rgba(160,185,235,.34)}
  .btn:active{transform:scale(.97)}
  .hint{text-align:center;font-size:11px;color:#4d566b;margin:0}

  /* ---------- SVG 主题联动 ---------- */
  #beams{opacity:var(--beam,.4);transition:opacity .7s}
  #binWrap{transition:filter .6s ease}
  [data-beat="7"] #binWrap,[data-beat="8"] #binWrap{filter:saturate(.5) brightness(.84)}
  #trophy{opacity:var(--trophy,0);transform:translateY(calc((1 - var(--trophy,0)) * 70px));transition:opacity .55s,transform .7s cubic-bezier(.2,1.3,.4,1)}
  #medal{opacity:var(--medal,0);transform:translateY(calc(var(--medal,0) * 0px - (1 - var(--medal,0)) * 80px));transition:opacity .5s,transform .7s cubic-bezier(.3,1.4,.4,1)}
  #desk{opacity:var(--kb,0);transition:opacity .5s}
  #armsUp{opacity:var(--trophy,0);transition:opacity .4s}

  /* 表情切换 */
  .ex{display:none}
  [data-expr="calm"]  #ex-calm,
  [data-expr="focus"] #ex-focus,
  [data-expr="smile"] #ex-smile,
  [data-expr="shout"] #ex-shout,
  [data-expr="sad"]   #ex-sad  {display:inline}

  @media (max-width:380px){
    .cap{font-size:13.5px}
    .chapters{font-size:10px}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="kicker">BLG · 一个赛季的四幕</div>
    <h1>bin 哥<em>滑动变阻器</em></h1>
  </header>

  <div class="stage" id="stage" data-expr="calm" data-ch="1">
    <div class="layer l-gold"></div>
    <div class="layer l-night"></div>

    <!-- ==================== 场景 ==================== -->
    <svg id="scene" viewBox="0 0 800 900" preserveAspectRatio="xMidYMid slice">
      <defs>
        <linearGradient id="skyG" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#0b1324"/>
          <stop offset="55%" stop-color="#070b14"/>
          <stop offset="100%" stop-color="#04060b"/>
        </linearGradient>
        <linearGradient id="beamG" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="rgba(200,220,255,.55)"/>
          <stop offset="100%" stop-color="rgba(120,160,255,0)"/>
        </linearGradient>
        <linearGradient id="goldBeamG" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="rgba(255,202,77,.6)"/>
          <stop offset="100%" stop-color="rgba(255,202,77,0)"/>
        </linearGradient>
        <radialGradient id="skinG" cx="42%" cy="34%" r="72%">
          <stop offset="0%" stop-color="#ffe0c6"/>
          <stop offset="60%" stop-color="#f7cda9"/>
          <stop offset="100%" stop-color="#e2ad86"/>
        </radialGradient>
        <linearGradient id="hairG" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#2a2f3a"/>
          <stop offset="100%" stop-color="#111419"/>
        </linearGradient>
        <linearGradient id="jerseyG" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#1b2740"/>
          <stop offset="100%" stop-color="#0a1120"/>
        </linearGradient>
        <linearGradient id="goldG" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#fff0b8"/>
          <stop offset="45%" stop-color="#ffca4d"/>
          <stop offset="100%" stop-color="#d99414"/>
        </linearGradient>
        <filter id="blur7"><feGaussianBlur stdDeviation="7"/></filter>
        <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
          <feGaussianBlur stdDeviation="10" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>

      <!-- 背景 -->
      <rect width="800" height="900" fill="url(#skyG)"/>

      <!-- 舞台灯 -->
      <g id="beams">
        <path d="M400 -40 L120 820 L250 820 Z" fill="url(#beamG)"/>
        <path d="M400 -40 L310 860 L430 860 Z" fill="url(#beamG)" opacity=".8"/>
        <path d="M400 -40 L560 830 L670 830 Z" fill="url(#goldBeamG)" opacity=".55"/>
        <path d="M400 -40 L680 800 L780 760 Z" fill="url(#goldBeamG)" opacity=".35"/>
      </g>

      <!-- 大屏 -->
      <g id="led" opacity=".8">
        <rect x="30" y="22" width="740" height="126" rx="8" fill="#060a12" stroke="#141f33" stroke-width="2"/>
        <g opacity=".35" stroke="#141f33" stroke-width="1" fill="none">
          <path d="M30 64 H770 M30 106 H770"/>
        </g>
        <text x="76" y="104" font-family="system-ui,sans-serif" font-size="44" font-weight="900"
              fill="#dfe9ff" letter-spacing="3" opacity=".9">BLG</text>
        <text x="724" y="104" text-anchor="end" font-family="system-ui,sans-serif" font-size="38" font-weight="900"
              fill="#ffca4d" opacity=".9">2026</text>
      </g>

      <!-- 观众（虚化） -->
      <g id="crowd" opacity=".6" filter="url(#blur7)">
        <path d="M0 640 H800 V900 H0 Z" fill="#04070d"/>
        <g fill="#16233a">
          <circle cx="46" cy="676" r="20"/><circle cx="118" cy="662" r="17"/><circle cx="188" cy="680" r="21"/>
          <circle cx="252" cy="664" r="17"/><circle cx="320" cy="682" r="20"/><circle cx="392" cy="666" r="17"/>
          <circle cx="466" cy="682" r="21"/><circle cx="534" cy="662" r="17"/><circle cx="602" cy="680" r="20"/>
          <circle cx="672" cy="664" r="17"/><circle cx="742" cy="680" r="21"/>
          <circle cx="60" cy="748" r="24"/><circle cx="150" cy="734" r="22"/><circle cx="236" cy="752" r="25"/>
          <circle cx="560" cy="752" r="25"/><circle cx="648" cy="734" r="22"/><circle cx="738" cy="750" r="24"/>
        </g>
      </g>

      <!-- 地板光 -->
      <ellipse cx="400" cy="880" rx="330" ry="90" fill="#0a1830" opacity=".85"/>
      <ellipse cx="400" cy="872" rx="230" ry="52" fill="#132a4e" opacity=".5" filter="url(#glow)"/>

      <!-- ==================== 人物 ==================== -->
      <g id="binWrap">
        <!-- 躯干 / 队服 -->
        <g id="torso">
          <path d="M182 900 C188 716 252 596 400 566 C548 596 612 716 618 900 Z" fill="url(#jerseyG)"/>
          <path d="M182 900 C188 716 252 596 400 566 C548 596 612 716 618 900" fill="none"
                stroke="#2b5cd6" stroke-width="2.5" opacity=".5"/>
          <path d="M352 578 L400 638 L448 578" fill="none" stroke="#2b5cd6" stroke-width="3" opacity=".55"/>
          <g opacity=".75">
            <rect x="278" y="676" width="46" height="16" rx="3" fill="#1f3763"/>
            <text x="301" y="688" text-anchor="middle" font-family="system-ui,sans-serif"
                  font-size="11" font-weight="800" fill="#9fc0ff" letter-spacing="1">BLG</text>
          </g>
          <text x="520" y="712" text-anchor="middle" font-family="system-ui,sans-serif"
                font-size="26" font-weight="900" fill="#eef4ff" letter-spacing="4" opacity=".45">BIN</text>
        </g>

        <!-- 脖子 -->
        <path d="M358 482 C358 536 366 566 400 572 C434 566 442 536 442 482 Z" fill="#dfa984"/>

        <!-- 后发 -->
        <ellipse cx="400" cy="332" rx="134" ry="124" fill="url(#hairG)"/>

        <!-- 耳 -->
        <ellipse cx="274" cy="398" rx="17" ry="26" fill="#eec19e"/>
        <ellipse cx="526" cy="398" rx="17" ry="26" fill="#eec19e"/>

        <!-- 脸 -->
        <path id="face" d="M400 250
                 C330 250 285 300 285 376
                 C285 432 302 472 342 496
                 C368 512 432 512 458 496
                 C498 472 515 432 515 376
                 C515 300 470 250 400 250 Z" fill="url(#skinG)"/>

        <!-- 腮红 -->
        <g opacity=".5">
          <ellipse cx="330" cy="446" rx="24" ry="13" fill="#ff8f8f" opacity=".22"/>
          <ellipse cx="470" cy="446" rx="24" ry="13" fill="#ff8f8f" opacity=".22"/>
        </g>

        <!-- 眉毛 -->
        <g id="brows">
          <path id="browL" d="M330 364 Q360 348 390 358" stroke="#181c24" stroke-width="13"
                stroke-linecap="round" fill="none"/>
          <path id="browR" d="M470 364 Q440 348 410 358" stroke="#181c24" stroke-width="13"
                stroke-linecap="round" fill="none"/>
        </g>

        <!-- ===== 表情：平静（默认） ===== -->
        <g class="ex" id="ex-calm">
          <path d="M325 402 Q354 384 383 402 Q354 418 325 402 Z" fill="#1b1f28"/>
          <path d="M475 402 Q446 384 417 402 Q446 418 475 402 Z" fill="#1b1f28"/>
          <path d="M325 400 Q354 382 383 400" fill="none" stroke="#0f1218" stroke-width="4" stroke-linecap="round"/>
          <path d="M475 400 Q446 382 417 400" fill="none" stroke="#0f1218" stroke-width="4" stroke-linecap="round"/>
          <circle cx="344" cy="398" r="4" fill="#fff" opacity=".92"/>
          <circle cx="456" cy="398" r="4" fill="#fff" opacity=".92"/>
          <path d="M370 462 Q400 472 430 462" fill="none" stroke="#8d3a44" stroke-width="7" stroke-linecap="round"/>
        </g>

        <!-- ===== 表情：专注/发力 ===== -->
        <g class="ex" id="ex-focus">
          <path d="M323 404 Q354 388 385 404 Q354 413 323 404 Z" fill="#1b1f28"/>
          <path d="M477 404 Q446 388 415 404 Q446 413 477 404 Z" fill="#1b1f28"/>
          <path d="M323 402 Q354 385 385 402" fill="none" stroke="#0f1218" stroke-width="4.5" stroke-linecap="round"/>
          <path d="M477 402 Q446 385 415 402" fill="none" stroke="#0f1218" stroke-width="4.5" stroke-linecap="round"/>
          <circle cx="342" cy="400" r="3.4" fill="#fff" opacity=".85"/>
          <circle cx="458" cy="400" r="3.4" fill="#fff" opacity=".85"/>
          <path d="M368 468 Q400 456 432 468" fill="none" stroke="#8d3a44" stroke-width="7" stroke-linecap="round"/>
        </g>

        <!-- ===== 表情：笑 ===== -->
        <g class="ex" id="ex-smile">
          <path d="M325 406 Q354 382 383 406" fill="none" stroke="#1b1f28" stroke-width="9" stroke-linecap="round"/>
          <path d="M475 406 Q446 382 417 406" fill="none" stroke="#1b1f28" stroke-width="9" stroke-linecap="round"/>
          <path d="M354 452 Q400 502 446 452 Q400 470 354 452 Z" fill="#7d2b34"/>
          <path d="M364 455 Q400 468 436 455 L436 452 Q400 462 364 452 Z" fill="#fff" opacity=".92"/>
        </g>

        <!-- ===== 表情：呐喊/震惊 ===== -->
        <g class="ex" id="ex-shout">
          <ellipse cx="354" cy="400" rx="26" ry="21" fill="#fff"/>
          <ellipse cx="446" cy="400" rx="26" ry="21" fill="#fff"/>
          <circle cx="354" cy="401" r="12" fill="#161a22"/>
          <circle cx="446" cy="401" r="12" fill="#161a22"/>
          <circle cx="349" cy="396" r="4" fill="#fff" opacity=".85"/>
          <circle cx="441" cy="396" r="4" fill="#fff" opacity=".85"/>
          <path d="M368 450 Q400 434 432 450 Q434 504 400 510 Q366 504 368 450 Z" fill="#5d1b24"/>
          <path d="M384 494 Q400 506 416 494 Q400 500 384 494 Z" fill="#ff8f8f" opacity=".8"/>
        </g>

        <!-- ===== 表情：低落 ===== -->
        <g class="ex" id="ex-sad">
          <path d="M325 400 Q354 392 383 404" fill="none" stroke="#1b1f28" stroke-width="8" stroke-linecap="round"/>
          <path d="M475 400 Q446 392 417 404" fill="none" stroke="#1b1f28" stroke-width="8" stroke-linecap="round"/>
          <path d="M370 472 Q400 460 430 472" fill="none" stroke="#8d3a44" stroke-width="7" stroke-linecap="round"/>
        </g>

        <!-- 鼻 -->
        <path d="M400 414 Q384 442 400 448 Q414 452 422 440" fill="none" stroke="#c78f6b"
              stroke-width="6" stroke-linecap="round" opacity=".9"/>

        <!-- 前发 -->
        <g id="fringe">
          <path d="M276 344 C264 232 330 192 400 192 C470 192 536 232 524 344
                   C512 306 496 282 474 274
                   C452 266 436 292 412 282
                   C390 272 370 296 348 292
                   C322 288 296 308 276 344 Z" fill="url(#hairG)"/>
          <path d="M412 282 C404 256 382 248 366 260 C382 254 398 260 412 282 Z" fill="#0d1016"/>
          <path d="M278 340 C268 364 272 392 284 406 C278 386 278 360 282 342 Z" fill="#14181f"/>
          <path d="M522 340 C532 364 528 392 516 406 C522 386 522 360 518 342 Z" fill="#14181f"/>
        </g>

        <!-- FMVP 奖牌 -->
        <g id="medal">
          <path d="M368 558 L394 640 L406 636 L384 554 Z" fill="#2b5cd6"/>
          <path d="M432 558 L406 640 L394 636 L416 554 Z" fill="#c8102e"/>
          <circle cx="400" cy="700" r="44" fill="url(#goldG)" filter="url(#glow)"/>
          <circle cx="400" cy="700" r="44" fill="none" stroke="#fff3c4" stroke-width="2" opacity=".8"/>
          <circle cx="400" cy="700" r="32" fill="none" stroke="#b87d10" stroke-width="1.5" opacity=".6"/>
          <text x="400" y="708" text-anchor="middle" font-family="system-ui,sans-serif"
                font-size="19" font-weight="900" fill="#7a4d05">FMVP</text>
        </g>

        <!-- 奖杯 -->
        <g id="trophy">
          <path d="M330 108 C330 192 356 220 400 230 C444 220 470 192 470 108 Z" fill="url(#goldG)" filter="url(#glow)"/>
          <ellipse cx="400" cy="108" rx="72" ry="15" fill="#ffeab0"/>
          <ellipse cx="400" cy="108" rx="58" ry="10" fill="#c98f16" opacity=".55"/>
          <path d="M384 230 h32 v38 h-32 Z" fill="url(#goldG)"/>
          <path d="M344 276 h112 l-14 -16 h-84 Z" fill="url(#goldG)"/>
          <path d="M352 132 C352 178 366 204 386 214" fill="none" stroke="#fff8d8" stroke-width="8" opacity=".65"/>
          <path d="M336 128 C300 140 302 194 344 204" fill="none" stroke="#e0a92e" stroke-width="11" stroke-linecap="round"/>
          <path d="M464 128 C500 140 498 194 456 204" fill="none" stroke="#e0a92e" stroke-width="11" stroke-linecap="round"/>
        </g>

        <!-- 举杯双臂 -->
        <g id="armsUp">
          <path d="M300 580 L214 448 L340 272" fill="none" stroke="#141d31" stroke-width="54"
                stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M500 580 L586 448 L460 272" fill="none" stroke="#141d31" stroke-width="54"
                stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M300 580 L214 448 L340 272" fill="none" stroke="#2b5cd6" stroke-width="3" opacity=".45"/>
          <path d="M500 580 L586 448 L460 272" fill="none" stroke="#2b5cd6" stroke-width="3" opacity=".45"/>
          <ellipse cx="350" cy="252" rx="26" ry="22" fill="#f0c39d" transform="rotate(-18 350 252)"/>
          <ellipse cx="450" cy="252" rx="26" ry="22" fill="#f0c39d" transform="rotate(18 450 252)"/>
          <path d="M336 244 q14 -14 26 0" fill="none" stroke="#c78f6b" stroke-width="3" opacity=".7"/>
          <path d="M438 244 q14 -14 26 0" fill="none" stroke="#c78f6b" stroke-width="3" opacity=".7"/>
        </g>
      </g>

      <!-- 前景：凌晨的训练桌 -->
      <g id="desk">
        <path d="M0 792 Q400 744 800 792 V900 H0 Z" fill="#04060b"/>
        <path d="M0 792 Q400 744 800 792" fill="none" stroke="#3f7bff" stroke-width="3" opacity=".75"/>
        <path d="M0 792 Q400 744 800 792" fill="none" stroke="#9fc8ff" stroke-width="12" opacity=".14"/>
        <g fill="#0d1626">
          <rect x="120" y="808" width="560" height="14" rx="4"/>
          <rect x="140" y="830" width="520" height="14" rx="4"/>
          <rect x="180" y="852" width="440" height="14" rx="4"/>
        </g>
        <rect x="120" y="808" width="560" height="14" rx="4" fill="#2f6bff" opacity=".22"/>
      </g>
    </svg>

    <img id="art" alt="">
    <img id="photo" alt="">
    <div class="rain" id="rain"></div>
    <div class="danmu" id="danmu"></div>
    <div class="layer l-alarm"></div>
    <div class="layer l-vig"></div>

    <div class="hud">
      <div class="chap" id="chap">第一幕 · 年初</div>
      <p class="cap" id="cap">春季赛首秀，镜头扫过一张生面孔</p>
    </div>
    <button class="photo-close" id="photoClose" aria-label="退出图片">✕</button>
  </div>

  <div class="timeline">
    <div class="track">
      <div class="fill" id="fill"></div>
      <input id="slider" type="range" min="0" max="14" step="1" value="0" aria-label="赛季时间轴">
    </div>
    <div class="chapters" id="chapters">
      <span>① 年初</span><span>② 先锋赛</span><span>③ MSI</span><span>④ S 赛</span>
    </div>
  </div>

  <div class="controls">
    <button class="btn" id="btnReset">↺ 复位</button>
    <label class="btn" for="file">换图</label>
    <input id="file" type="file" accept="image/*" hidden>
  </div>
  <p class="hint">拖动时间轴走完整个赛季 · 键盘 ← → 也能拨</p>
</div>

<script>
(() => {
  "use strict";

  const TONES = {
    curious: ["这上单哪来的","新人有点东西","记住这个名字","潜力股","打得挺稳","谁啊这是"],
    praise:  ["bin哥牛逼","这波操作","世界第一上单","猛","拉满了","上单之神","666","这波细节"],
    hate:    ["上头了","不团队","卖队友","这操作看不懂","又送了","急什么","心态呢","别硬上啊"],
    hope:    ["还有机会","加油","我们信你","慢慢来","站起来","稳住心态","下一把"],
    hype:    ["开！！！","这波定生死","屏住呼吸","别慌","上上上","团！！","就看这一波"],
    cheer:   ["世界第一上单","BLG！BLG！","冠军！","捧杯！！！","圆梦了","哭了","bin！bin！bin！"]
  };

  /* 15 个节拍 = 四幕 */
  const BEATS = [
    {ch:1, title:"第一幕 · 年初",       cap:"春季赛首秀，镜头扫过一张生面孔",            tone:"curious", expr:"calm",  warm:.08, beam:.35, alarm:0,   night:0},
    {ch:1, title:"第一幕 · 年初",       cap:"单杀老将，弹幕第一次打出他的名字",            tone:"curious", expr:"focus", warm:.16, beam:.45, alarm:0,   night:0, brow:"angry"},
    {ch:1, title:"第一幕 · 年初",       cap:"赛后采访：我想赢。",                          tone:"praise",  expr:"calm",  warm:.26, beam:.5,  alarm:0,   night:0},
    {ch:2, title:"第二幕 · 先锋赛",     cap:"先锋赛 · 越塔跟喝水一样",                     tone:"praise",  expr:"focus", warm:.5,  beam:.7,  alarm:0,   night:0},
    {ch:2, title:"第二幕 · 先锋赛",     cap:"半决赛 1v3，一个人把队伍扛在肩上",            tone:"praise",  expr:"shout", warm:.72, beam:.8,  alarm:0,   night:0, brow:"angry"},
    {ch:2, title:"第二幕 · 先锋赛",     cap:"夺冠，FMVP —— 他值得",                        tone:"praise",  expr:"smile", warm:.95, beam:.9,  alarm:0,   night:0, medal:true},
    {ch:3, title:"第三幕 · MSI",        cap:"MSI 小组赛全胜，气焰拉满",                     tone:"praise",  expr:"smile", warm:.9,  beam:.85, alarm:0,   night:0},
    {ch:3, title:"第三幕 · MSI",        cap:"一波硬越塔，大龙拱手送人",                     tone:"hate",    expr:"shout", warm:.25, beam:.6,  alarm:.9,  night:0, shake:true, brow:"angry"},
    {ch:3, title:"第三幕 · MSI",        cap:"输了。镜头里他低着头，弹幕在骂：上头、不团队",  tone:"hate",    expr:"sad",   warm:.05, beam:.3,  alarm:.55, night:0},
    {ch:3, title:"第三幕 · MSI",        cap:"凌晨三点，训练室只剩他这块屏还亮着",           tone:"hope",    expr:"sad",   warm:.05, beam:.2,  alarm:0,   night:1, keyboard:true},
    {ch:3, title:"第三幕 · MSI",        cap:"复盘、认错，把队伍重新捏回来",                 tone:"hope",    expr:"focus", warm:.35, beam:.5,  alarm:0,   night:.3},
    {ch:4, title:"第四幕 · S 赛",       cap:"S 赛小组出线，一步一步",                       tone:"hope",    expr:"focus", warm:.5,  beam:.65, alarm:0,   night:0},
    {ch:4, title:"第四幕 · S 赛",       cap:"八强、四强，一场一场赢回来",                   tone:"praise",  expr:"shout", warm:.72, beam:.8,  alarm:0,   night:0},
    {ch:4, title:"第四幕 · S 赛",       cap:"决胜局最后一波，全场屏息",                     tone:"hype",    expr:"shout", warm:.85, beam:.9,  alarm:0,   night:0, brow:"angry"},
    {ch:4, title:"第四幕 · S 赛",       cap:"捧杯。金色雨落下来",                           tone:"cheer",   expr:"smile", warm:1,   beam:1,   alarm:0,   night:0, rain:true, trophy:true}
  ];

  const $ = id => document.getElementById(id);
  const stage = $("stage"), slider = $("slider"), fill = $("fill");
  const danmuBox = $("danmu"), rainBox = $("rain"), photo = $("photo");
  const MAX = BEATS.length - 1;

  let level = 0, acc = 0, lastT = 0, tone = "curious";

  /* ---------- 图片素材：assets/ 放图即用，没图则用 SVG 漫画 ---------- */
  const artEl = $("art");
  const ART = {
    0:"act1", 1:"act1", 2:"act1",
    3:"act2", 4:"act2", 5:"act2-fmvp",
    6:"act3", 7:"act3", 8:"act3",
    9:"act3-night", 10:"act3-recover",
    11:"act4", 12:"act4", 13:"act4", 14:"act4-cup"
  };
  const FALLBACK = { "act2-fmvp":"act2", "act3-night":"act3", "act3-recover":"act3", "act4-cup":"act4" };
  const EXTS = ["png", "jpg", "webp"];
  const artCache = new Map();

  function probe(src) {
    return new Promise(ok => {
      const im = new Image();
      im.onload = () => ok(im.naturalWidth ? src : null);
      im.onerror = () => ok(null);
      im.src = src;
    });
  }

  async function resolveArt(name) {
    if (artCache.has(name)) return artCache.get(name);
    let found = null;
    for (const e of EXTS) {
      found = await probe(`assets/${name}.${e}`);
      if (found) break;
    }
    if (!found && FALLBACK[name]) found = await resolveArt(FALLBACK[name]);
    artCache.set(name, found);
    return found;
  }

  function syncArt() {
    if (stage.classList.contains("photo")) return;
    const name = ART[level];
    if (!name) return;
    resolveArt(name).then(src => {
      if (ART[level] !== name) return;                 // 已经滑走了
      if (!src) { stage.classList.remove("art", "art-ready"); return; }
      stage.classList.add("art");
      if (artEl.dataset.name !== name) {
        artEl.dataset.name = name;
        stage.classList.remove("art-ready");
        artEl.src = src;
        if (artEl.complete) stage.classList.add("art-ready");
      }
    });
  }
  artEl.addEventListener("load", () => stage.classList.add("art-ready"));
  artEl.addEventListener("error", () => {
    stage.classList.remove("art", "art-ready");
    artEl.dataset.name = "";
  });
  resolveArt(ART[0]);                                  // 预热

  /* 金色雨预先铺好 */
  for (let i = 0; i < 26; i++) {
    const p = document.createElement("i");
    p.style.left = (Math.random() * 100).toFixed(1) + "%";
    p.style.animationDelay = (Math.random() * 2.4).toFixed(2) + "s";
    p.style.animationDuration = (1.6 + Math.random() * 1.6).toFixed(2) + "s";
    p.style.opacity = (0.5 + Math.random() * 0.5).toFixed(2);
    rainBox.appendChild(p);
  }

  function apply(i) {
    level = Math.max(0, Math.min(MAX, i | 0));
    const b = BEATS[level];
    tone = b.tone;

    stage.dataset.beat = level;
    stage.dataset.ch = b.ch;
    stage.dataset.expr = b.expr;

    stage.style.setProperty("--warm", b.warm);
    stage.style.setProperty("--beam", b.beam);
    stage.style.setProperty("--alarm", b.alarm || 0);
    stage.style.setProperty("--night", b.night || 0);
    stage.style.setProperty("--medal", b.medal ? 1 : 0);
    stage.style.setProperty("--trophy", b.trophy ? 1 : 0);
    stage.style.setProperty("--kb", b.keyboard ? 1 : 0);

    stage.classList.toggle("shake", !!b.shake);
    stage.classList.toggle("rain-on", !!b.rain);
    syncArt();

    $("chap").textContent = b.title;
    $("cap").textContent = b.cap;
    slider.value = level;
    fill.style.width = (level / MAX * 100) + "%";

    [...$("chapters").children].forEach((s, k) => s.classList.toggle("on", k + 1 === b.ch));
  }

  /* 弹幕 */
  function spawn() {
    if (danmuBox.childElementCount > 24) return;
    const pool = TONES[tone] || TONES.praise;
    const s = document.createElement("span");
    s.textContent = pool[(Math.random() * pool.length) | 0];
    s.style.top = (6 + Math.random() * 62) + "%";
    s.style.fontSize = (11 + Math.random() * 6).toFixed(1) + "px";
    s.style.color = tone === "hate" ? "#ff8f8f"
                   : tone === "cheer" ? "#ffe08a"
                   : tone === "hope" ? "#a6f0c8"
                   : "#dce7ff";
    const dur = 5.4 - level / MAX * 2.6 + Math.random() * 1.4;
    s.style.animation = `fly ${dur.toFixed(2)}s linear forwards`;
    s.addEventListener("animationend", () => s.remove());
    danmuBox.appendChild(s);
  }

  function loop(now) {
    const dt = Math.min(60, now - lastT || 16);
    lastT = now;
    const rate = tone === "hype" || tone === "cheer" ? 320
               : tone === "hate" ? 460
               : tone === "hope" ? 700 : 900;
    acc += dt;
    if (acc > rate) { acc = 0; spawn(); }
    requestAnimationFrame(loop);
  }

  /* 交互 */
  slider.addEventListener("input", e => apply(+e.target.value));
  $("btnReset").addEventListener("click", () => {
    if (stage.classList.contains("photo")) exitPhoto();
    apply(0);
  });
  window.addEventListener("keydown", e => {
    if (e.key === "ArrowRight" || e.key === "ArrowUp") { apply(level + 1); e.preventDefault(); }
    if (e.key === "ArrowLeft"  || e.key === "ArrowDown") { apply(level - 1); e.preventDefault(); }
    if (e.key === "Home") apply(0);
    if (e.key === "End")  apply(MAX);
  });

  /* 换图：按图片原始比例自适应，长图整张显示不裁切 */
  $("file").addEventListener("change", e => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    const url = URL.createObjectURL(f);
    const probe = new Image();
    probe.onload = () => {
      const ar = Math.max(0.42, probe.naturalWidth / probe.naturalHeight);
      stage.style.aspectRatio = `${ar}`;
      photo.src = url;
      stage.classList.add("photo");
      if (probe.naturalWidth / probe.naturalHeight < 0.42) {
        $("cap").textContent = BEATS[level].cap + "（长图已整张显示，未裁切）";
      }
    };
    probe.src = url;
    e.target.value = "";
  });

  function exitPhoto() {
    stage.classList.remove("photo");
    stage.style.aspectRatio = "";
    photo.removeAttribute("src");
    apply(level);
  }
  $("photoClose").addEventListener("click", exitPhoto);

  /* 启动 */
  const q = parseInt(new URLSearchParams(location.search).get("b"), 10);
  apply(Number.isFinite(q) ? q : 0);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
