<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>低多边形肖像生成器 · Low-Poly Portrait</title>
<style>
  :root{--bg:#0b0d12;--line:rgba(160,185,235,.16);--text:#e9eefb;--muted:#7c8aa6;--gold:#ffca4d}
  *{box-sizing:border-box}
  body{margin:0;min-height:100%;padding:24px 16px 40px;display:flex;justify-content:center;
       background:radial-gradient(120% 70% at 50% -10%,#141c2e,#080a10 60%);
       color:var(--text);font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
  .wrap{width:100%;max-width:460px;display:flex;flex-direction:column;gap:14px}
  h1{margin:0;font-size:19px;font-weight:800;text-align:center}
  .sub{margin:0;text-align:center;font-size:12px;color:var(--muted);line-height:1.7}
  .stage{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line);
         background:#12151c;aspect-ratio:4/5;display:grid;place-items:center}
  canvas{width:100%;height:100%;display:block;image-rendering:auto}
  .drop{position:absolute;inset:0;display:grid;place-items:center;text-align:center;
        font-size:13px;color:var(--muted);padding:20px;pointer-events:none}
  .drop b{display:block;color:#cfdcf5;font-size:15px;margin-bottom:6px}
  .stage.has canvas{display:block}
  label.btn,button{font:inherit;font-size:12.5px;font-weight:700;color:#c9d5ec;
    background:rgba(255,255,255,.05);border:1px solid rgba(160,185,235,.2);
    border-radius:99px;height:36px;padding:0 15px;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;cursor:pointer;transition:.15s;user-select:none}
  label.btn:hover,button:hover{background:rgba(255,255,255,.1);color:#fff}
  button:active,label.btn:active{transform:scale(.97)}
  .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .ctrl{display:flex;flex-direction:column;gap:6px;font-size:11.5px;color:var(--muted)}
  .ctrl .line{display:flex;justify-content:space-between;align-items:center}
  .ctrl .line b{color:#cfdcf5;font-variant-numeric:tabular-nums}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:20px;background:transparent}
  input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:9px;background:rgba(255,255,255,.12)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;
    background:#fff;margin-top:-5px;box-shadow:0 0 0 3px rgba(11,13,18,.9)}
  input[type=range]::-moz-range-track{height:4px;border-radius:9px;background:rgba(255,255,255,.12)}
  input[type=range]::-moz-range-thumb{width:14px;height:14px;border:none;border-radius:50%;background:#fff}
  .chk{display:flex;align-items:center;gap:7px;font-size:12px;color:#c9d5ec}
  input[type=checkbox]{accent-color:var(--gold);width:15px;height:15px}
  .tip{font-size:11px;color:#5f6c85;line-height:1.75;margin:0}
  .tip code{color:#9fb8e6;background:rgba(255,255,255,.06);padding:1px 5px;border-radius:4px}
</style>
</head>
<body>
<div class="wrap">
  <h1>低多边形肖像生成器</h1>
  <p class="sub">Low-Poly Portrait · 本地计算，不上传、不联网<br>一张照片 → 三角面片肖像，可导出四幕素材</p>

  <div class="stage" id="stage">
    <canvas id="cv" width="640" height="800"></canvas>
    <div class="drop" id="drop"><span><b>点下面的按钮选一张照片</b>或把图片拖进来<br>建议正脸 / 3-4 侧脸，脸部占画面大一点</span></div>
  </div>

  <div class="row">
    <label class="btn" for="file">选择照片</label>
    <input id="file" type="file" accept="image/*" hidden>
    <button id="btnOne">导出这一张</button>
    <button id="btnFour">一键导出四幕</button>
  </div>

  <div class="ctrl">
    <div class="line"><span>面片密度</span><b id="vN">44</b></div>
    <input id="n" type="range" min="12" max="90" step="2" value="44">
  </div>
  <div class="ctrl">
    <div class="line"><span>面片抖动（越大多边形越不规则）</span><b id="vJ">0.65</b></div>
    <input id="jit" type="range" min="0" max="0.95" step="0.05" value="0.65">
  </div>
  <div class="ctrl">
    <div class="line"><span>对比 / 饱和度</span><b id="vC">1.00</b></div>
    <input id="con" type="range" min="0.7" max="1.6" step="0.05" value="1">
  </div>
  <div class="row" style="justify-content:flex-start">
    <label class="chk"><input id="flat" type="checkbox"> 背景压平（取四角颜色，做成纯色背景）</label>
  </div>

  <p class="tip">
    导出后把文件改名成 <code>act1.png</code> <code>act2.png</code> <code>act3.png</code> <code>act4.png</code>
    丢进滑动变阻器的 <code>assets/</code> 文件夹，页面会自动换成这套画面。<br>
    「一键导出四幕」会按 年初冷蓝 / 先锋赛金色 / MSI 暗红 / 捧杯暖金 四套色调各出一张。
  </p>
</div>

<script>
(() => {
  "use strict";

  /* ============================== 纯计算核心 ============================== */
  /* TINT: 0=原色 1=冷蓝 2=金 3=暗红 4=暖金 */
  function applyTint(c, k) {
    let [r, g, b] = c;
    if (k === 1) { r *= 0.82; g *= 0.95; b = Math.min(255, b * 1.28 + 14); }
    else if (k === 2) { r = Math.min(255, r * 1.16 + 10); g = Math.min(255, g * 1.04 + 4); b *= 0.82; }
    else if (k === 3) { r = Math.min(255, r * 1.05); g *= 0.62; b *= 0.66; r *= 0.86; }
    else if (k === 4) { r = Math.min(255, r * 1.22 + 16); g = Math.min(255, g * 1.1 + 8); b *= 0.74; }
    return [r | 0, g | 0, b | 0];
  }

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  /* px: RGBA 数组, W/H: 像素尺寸
     n: 每行格子数, jit: 抖动 0~1, flatBg: 是否压平背景
     返回 [{ pts:[[x,y],[x,y],[x,y]], c:[r,g,b] }, ...] */
  function buildPolys(px, W, H, n, jit, flatBg, seed) {
    const rnd = mulberry32(seed || 1);
    const cw = W / n, ch = H / n;

    /* 顶点：规则网格 + 随机抖动（边上的点只沿边抖，保证铺满） */
    const V = [];
    for (let j = 0; j <= n; j++) {
      V[j] = [];
      for (let i = 0; i <= n; i++) {
        const jx = (i > 0 && i < n) ? (rnd() - 0.5) * cw * jit : 0;
        const jy = (j > 0 && j < n) ? (rnd() - 0.5) * ch * jit : 0;
        V[j][i] = [i * cw + jx, j * ch + jy];
      }
    }

    /* 背景色：取四角平均 */
    let bg = null;
    if (flatBg) {
      const corners = [[0, 0], [W - 1, 0], [0, H - 1], [W - 1, H - 1]];
      let r = 0, g = 0, b = 0;
      corners.forEach(([x, y]) => {
        const o = (y * W + x) * 4; r += px[o]; g += px[o + 1]; b += px[o + 2];
      });
      bg = [r / 4, g / 4, b / 4];
    }

    const out = [];
    for (let j = 0; j < n; j++) {
      for (let i = 0; i < n; i++) {
        const a = V[j][i], b = V[j][i + 1], c = V[j + 1][i + 1], d = V[j + 1][i];
        if (rnd() < 0.5) { out.push(mk(a, b, c)); out.push(mk(a, c, d)); }
        else { out.push(mk(a, b, d)); out.push(mk(b, c, d)); }
      }
    }
    return out;

    function sample(x, y) {
      const xi = Math.max(0, Math.min(W - 1, x | 0));
      const yi = Math.max(0, Math.min(H - 1, y | 0));
      const o = (yi * W + xi) * 4;
      return [px[o], px[o + 1], px[o + 2]];
    }
    function mk(p, q, r) {
      const cx = (p[0] + q[0] + r[0]) / 3;
      const cy = (p[1] + q[1] + r[1]) / 3;
      /* 4 点采样：重心 + 三个顶点各向重心收 60%，色彩更接近块面平均 */
      let sr = 0, sg = 0, sb = 0;
      const ss = [[cx, cy],
                  [p[0] + (cx - p[0]) * 0.6, p[1] + (cy - p[1]) * 0.6],
                  [q[0] + (cx - q[0]) * 0.6, q[1] + (cy - q[1]) * 0.6],
                  [r[0] + (cx - r[0]) * 0.6, r[1] + (cy - r[1]) * 0.6]];
      for (const [x, y] of ss) {
        const c0 = sample(x, y); sr += c0[0]; sg += c0[1]; sb += c0[2];
      }
      let col = [sr / 4, sg / 4, sb / 4];
      if (bg) {
        /* 与背景色接近的面片 → 拉平成纯色 */
        const dist = Math.abs(col[0] - bg[0]) + Math.abs(col[1] - bg[1]) + Math.abs(col[2] - bg[2]);
        if (dist < 46) col = [bg[0], bg[1], bg[2]];
      }
      return { pts: [p, q, r], c: [col[0] | 0, col[1] | 0, col[2] | 0] };
    }
  }
  /* ============================ 纯计算核心 END ============================ */

  const cv = document.getElementById("cv");
  const ctx = cv.getContext("2d");
  const stage = document.getElementById("stage");
  const drop = document.getElementById("drop");
  const CW = 640, CH = 800;

  let img = null;
  let srcData = null;   // {px, W, H}

  /* 把图片 cover 裁到 4:5 并取像素 */
  function prepare(image) {
    const c = document.createElement("canvas");
    c.width = CW; c.height = CH;
    const g = c.getContext("2d");
    const ar = CW / CH, iar = image.naturalWidth / image.naturalHeight;
    let sw = image.naturalWidth, sh = image.naturalHeight, sx = 0, sy = 0;
    if (iar > ar) { sw = sh * ar; sx = (image.naturalWidth - sw) / 2; }
    else { sh = sw / ar; sy = (image.naturalHeight - sh) * 0.4; }
    g.drawImage(image, sx, sy, sw, sh, 0, 0, CW, CH);
    srcData = { px: g.getImageData(0, 0, CW, CH).data, W: CW, H: CH };
  }

  function render(tint) {
    if (!srcData) return;
    const n = +document.getElementById("n").value;
    const jit = +document.getElementById("jit").value;
    const flatBg = document.getElementById("flat").checked;
    const con = +document.getElementById("con").value;

    let polys = buildPolys(srcData.px, srcData.W, srcData.H, n, jit, flatBg, 20260215);

    ctx.clearRect(0, 0, CW, CH);
    ctx.lineJoin = "round";
    for (const t of polys) {
      let c = t.c;
      if (tint) c = applyTint(c, tint);
      if (con !== 1) {
        c = c.map(v => Math.max(0, Math.min(255, (v - 128) * con + 128)));
      }
      const col = `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})`;
      ctx.beginPath();
      ctx.moveTo(t.pts[0][0], t.pts[0][1]);
      ctx.lineTo(t.pts[1][0], t.pts[1][1]);
      ctx.lineTo(t.pts[2][0], t.pts[2][1]);
      ctx.closePath();
      ctx.fillStyle = col;
      ctx.fill();
      ctx.strokeStyle = col;
      ctx.lineWidth = 0.7;     /* 补缝 */
      ctx.stroke();
    }
  }

  /* ---------- 交互 ---------- */
  document.getElementById("file").addEventListener("change", e => {
    const f = e.target.files && e.target.files[0];
    if (f) loadFile(f);
    e.target.value = "";
  });

  function loadFile(f) {
    const url = URL.createObjectURL(f);
    const im = new Image();
    im.onload = () => {
      img = im;
      prepare(im);
      stage.classList.add("has");
      drop.style.display = "none";
      render(0);
    };
    im.src = url;
  }

  ["n", "jit", "con"].forEach(id => {
    document.getElementById(id).addEventListener("input", () => {
      if (id === "n") document.getElementById("vN").textContent = document.getElementById("n").value;
      if (id === "jit") document.getElementById("vJ").textContent = (+document.getElementById("jit").value).toFixed(2);
      if (id === "con") document.getElementById("vC").textContent = (+document.getElementById("con").value).toFixed(2);
      render(0);
    });
  });
  document.getElementById("flat").addEventListener("change", () => render(0));

  function save(name) {
    cv.toBlob(b => {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(b);
      a.download = name;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 3000);
    }, "image/png");
  }

  document.getElementById("btnOne").addEventListener("click", () => {
    if (!srcData) return alert("先选一张照片");
    save("poly-portrait.png");
  });

  document.getElementById("btnFour").addEventListener("click", () => {
    if (!srcData) return alert("先选一张照片");
    const names = ["act1.png", "act2.png", "act3.png", "act4.png"];
    const tints = [1, 2, 3, 4];
    let k = 0;
    (function next() {
      if (k >= 4) { render(0); return; }
      render(tints[k]);
      cv.toBlob(b => {
        const a = document.createElement("a");
        a.href = URL.createObjectURL(b);
        a.download = names[k];
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 4000);
        k++;
        setTimeout(next, 420);
      }, "image/png");
    })();
  });

  /* 拖拽 */
  ["dragover", "drop"].forEach(ev => stage.addEventListener(ev, e => {
    e.preventDefault();
    if (ev === "drop" && e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]);
  }));

  /* 贴图/粘贴支持 */
  window.addEventListener("paste", e => {
    const it = [...(e.clipboardData?.items || [])].find(i => i.type.startsWith("image/"));
    if (it) loadFile(it.getAsFile());
  });
})();
</script>
</body>
</html>
